<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday!</title>
  <style>
    :root {
      --bg: #fff0f8;
      --text: #2b2b2b;
      --accent: #8e3fbf;
      --accent2: #ff6fb5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      line-height: 1.5;
    }

    #start {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #start h1 {
      font-size: 3rem;
      color: var(--accent);
      margin: 0 0 10px;
    }

    button {
      font-family: inherit;
      font-size: 1.3rem;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover { background: #732f9e; }

    /* Everything that pops up lands in here */
    #stage {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 140px;
    }

    .pop {
      margin: 30px auto;
      animation: pop 0.4s ease-out;
    }

    @keyframes pop {
      0%   { transform: scale(0.2); opacity: 0; }
      70%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .words {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .photo {
      background: white;
      padding: 10px 10px 14px;
      border: 1px solid #ddd;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      max-width: 380px;
    }

    .photo img {
      width: 100%;
      display: block;
      background: #eee;
      min-height: 200px;
    }

    .photo p {
      margin: 8px 0 0;
      font-style: italic;
    }

    /* The last "look at me" part */
    .finale {
      border: 6px dotted var(--accent2);
      padding: 30px 20px;
      background: white;
    }

    .finale h2 {
      font-size: 3rem;
      color: var(--accent);
      margin: 0 0 16px;
    }

    /* Floating click button at the bottom */
    #next {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      display: none;
    }
  </style>
</head>
<body>

  <div id="start">
    <h1>Happy Birthday, SAVANNA!</h1>
    <p>I made you something. Click the button.</p>
    <button id="startBtn">Click me</button>
  </div>

  <div id="stage"></div>
  <button id="next">Keep going</button>

  <script>
    var steps = [
      { type: "words", text: "Happy birthday Savannaaaaaa!!" },
      { type: "words", text: "Thanks for being the best roommate everrrr. Can't believe it's been over a year since we first met 🤯 :D" },
      { type: "photo", src: "photo1.jpg", caption: "First time we talked😬" },
      { type: "words", text: "Even though we are just in our second years, I feel like I have known you forever😘 I could not imagine my college life without you!" },
      { type: "photo", src: "photo2.jpg", caption: "Dilly Dallying ~" },
      { type: "words", text: "Super duper happy we are finally roomates again now 🎉 I'm sorry but now you cannot get rid of me ever and we shall be roomates for ever and ever 🤗" },
      { type: "photo", src: "photo3.jpg", caption: "Baby's first crochettttttttt" },
      { type: "words", text: "Today is YOUR BIG DAY!! 19!!!!! I hope you have the most amazing day, week, month, and year!!! (Love you!! and don't forget about me at valencia🥺)" },
      { type: "words", text: "Okay, one more thing..." }
    ];

   
    var finaleTitle = "LOOK AT ME";
    var finaleText = "Happy birthday from your favorite roommate! I love you so much and I hope you have the best birthday ever!!";

    var stage = document.getElementById("stage");
    var nextBtn = document.getElementById("next");
    var current = 0;
    var finished = false;

    document.getElementById("startBtn").onclick = function () {
      document.getElementById("start").style.display = "none";
      nextBtn.style.display = "block";
      showNext();
    };

    nextBtn.onclick = showNext;

    function showNext() {
      if (finished) return;
      var box = document.createElement("div");
      box.className = "pop";

      if (current < steps.length) {
        var s = steps[current];
        if (s.type === "words") {
          box.className += " words";
          box.textContent = s.text;
        } else {
          box.className += " photo";
          
          var tilt = Math.floor(Math.random() * 7) - 3;
          box.style.transform = "rotate(" + tilt + "deg)";
          box.innerHTML = '<img src="' + s.src + '" alt="photo">' +
                          '<p>' + (s.caption || "") + '</p>';
        }
        current++;
      } else {
        box.className += " finale";
        box.innerHTML = "<h2>" + finaleTitle + "</h2>" +
                        "<p>" + finaleText + "</p>";
        finished = true;
        nextBtn.style.display = "none";
      }

      stage.appendChild(box);
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Spacebar or Enter also works
    document.addEventListener("keydown", function (e) {
      if (e.key === " " && nextBtn.style.display === "block") {
        e.preventDefault();
        showNext();
      }
    });
  </script>

</body>
</html>
